<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iPhone 11 preview</title>
<style>
  :root { --w: 414px; --h: 896px; --bezel: 14px; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d9d8d4; overflow: hidden; }
  .stage { transform-origin: center; }
  .phone { position: relative; width: calc(var(--w) + var(--bezel) * 2); height: calc(var(--h) + var(--bezel) * 2); border-radius: 68px; background: #0b0b0c; padding: var(--bezel); box-shadow: 0 0 0 2px #6b6b70, 0 0 0 5px #1c1c1e, 0 30px 80px rgba(0,0,0,.35); }
  .phone::before, .phone::after { content: ''; position: absolute; left: -7px; width: 3px; background: #3a3a3c; border-radius: 2px; }
  .phone::before { top: 150px; height: 56px; box-shadow: 0 76px 0 #3a3a3c; }
  .phone::after { right: -7px; left: auto; top: 200px; height: 90px; }
  .screen { position: relative; width: var(--w); height: var(--h); border-radius: 54px; overflow: hidden; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 210px; height: 30px; background: #0b0b0c; border-radius: 0 0 22px 22px; z-index: 5; pointer-events: none; }
  .notch::before { content: ''; position: absolute; top: 10px; left: 60px; width: 56px; height: 6px; border-radius: 3px; background: #1d1d20; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: rgba(128,128,128,.7); z-index: 5; pointer-events: none; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone">
      <div class="screen">
        <div class="notch"></div>
        <iframe src="/" title="App preview"></iframe>
        <div class="home"></div>
      </div>
    </div>
  </div>
<script>
  const fit = () => { const s = Math.min(1, (innerHeight - 40) / 924, (innerWidth - 40) / 442); document.getElementById('stage').style.transform = 'scale(' + s + ')'; };
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
